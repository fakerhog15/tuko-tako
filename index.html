<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veltris</title>
<link rel="icon" type="image/png" href="icon.png?v=14">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="board" width="576" height="660"></canvas>
      <div id="hud">
        <h1 class="logo">VEL<span>TRIS</span></h1>
        <div class="panel">
          <div class="label">MUSIC</div>
          <button id="musicBtn" title="Switch track">TRACK: MAIN MENU</button>
          <button id="muteBtn" title="Turn music on/off">MUSIC: ON</button>
          <label class="vol" for="volumeSlider">
            <span>VOLUME <b id="volumeVal">50%</b></span>
            <input id="volumeSlider" type="range" min="0" max="100" step="1" value="50"
                   title="Music volume" aria-label="Music volume">
          </label>
        </div>
        <div class="panel">
          <div class="label">DISPLAY</div>
          <button id="modeBtn" title="Cycle difficulty: Easy / Medium / Hard">MODE: MEDIUM</button>
          <button id="crtBtn" title="Cycle display filter: CRT + RF / CRT / Off">FILTER: CRT + RF</button>
          <button id="pauseBtn" title="Pause / resume (Enter)">PAUSE</button>
          <div class="stat" id="rendererInfo">GPU: &mdash;</div>
          <div class="stat" id="fpsInfo">&mdash; FPS</div>
          <div class="stat" id="colorsInfo">6 COLORS</div>
        </div>
        <div class="controls">
          <p><b>&larr; &rarr;</b> Move</p>
          <p><b>&uarr;</b> / <b>X</b> Rotate</p>
          <p><b>Z</b> Rotate CCW</p>
          <p><b>&darr;</b> Soft drop</p>
          <p><b>Space</b> Hard drop</p>
          <p><b>C</b> Hold piece</p>
          <p><b>Enter</b> Pause</p>
        </div>
      </div>
    </div>

    <div id="overlay" class="show">
      <div class="modal">
        <img src="icon.png?v=14" alt="Veltris" class="modal-icon">
        <h2>VELTRIS</h2>
        <p class="tag">Match 4 or more squares of the same color.<br>Chain them for a big score!</p>
        <button id="startBtn">START</button>
        <p class="hint">Music plays while you play.</p>
      </div>
    </div>
  </div>

  <div id="touch">
    <button data-act="left">&#9664;</button>
    <button data-act="rotL">&#8630;</button>
    <button data-act="rotR">&#8631;</button>
    <button data-act="right">&#9654;</button>
    <button data-act="down">&#9660;</button>
    <button data-act="drop">DROP</button>
    <button data-act="hold">HOLD</button>
    <button data-act="pause">II</button>
  </div>

  <audio id="music" src="music.mp3" loop preload="auto"></audio>
  <script src="game.js?v=14"></script>
</body>
</html>
